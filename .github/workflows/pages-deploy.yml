name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - CONTENT_IDEAS.md

  # Manual run: rebuilds + redeploys, then re-sends the notification for the latest Rundown.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Also validates every _data/digests/*.json against the schema in src/content.config.ts.
      - name: Build site
        run: npx astro build

      - name: Check internal links
        run: npm run check:links

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Open an issue (=> GitHub email notification) when a new Inference Rundown was deployed.
  # Created by github-actions[bot], so GitHub notifies you as the repo owner/watcher.
  notify-rundown:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect new rundown
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then  # manual run = re-send notification for the latest issue
            echo "file=$(ls _data/digests/*.json | sort | tail -1)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          f=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- '_data/digests/*.json' | sort | tail -1)
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Open notification issue
        if: steps.detect.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.detect.outputs.file }}
          SITE: https://brayd-1573.github.io
        run: |
          key=$(basename "$FILE" .json)
          issue=$(jq -r .issue "$FILE")
          headline=$(jq -r .headline "$FILE")
          url="$SITE/rundown/$key/"
          {
            echo "## [$headline]($url)"
            echo
            jq -r .tldr "$FILE"
            echo
            echo "**This week:**"
            jq -r '.prs | length | "- \(.) vLLM PRs worth reading"' "$FILE"
            jq -r '.contribute[] | "- Contribution pick: [#\(.number) \(.title)](\(.url)) (\(.difficulty))"' "$FILE"
            jq -r '.papers | length | "- \(.) papers"' "$FILE"
            jq -r '(.videos // []) | length | "- \(.) videos"' "$FILE"
            echo
            echo "**[Read Rundown #$issue →]($url)**"
            echo
            echo "_Close this issue once you've read it._"
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Inference Rundown #$issue: $headline" --body-file body.md
